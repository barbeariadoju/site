<!doctype html><html lang="pt-BR"><head><title>Lista de espera | Barbearia OS</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0b"><link rel="icon" href="assets/icon-192.png?v=2"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css?v=29.259.0"><link rel="stylesheet" href="/css/06-admin-reforma.css?v=29.286.0"><link rel="manifest" href="admin-manifest.webmanifest?v=29.205.6"><link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png?v=2">
<link rel="stylesheet" href="/css/08-admin-telas.css?v=29.255.0">
</head><body data-admin-page="espera"><div class="bg-grain"></div><section id="admin-login" class="admin-auth-card" data-shell="login"></section><div id="admin-app" class="admin-app" hidden><aside class="admin-sidebar" data-shell="sidebar"></aside><main class="admin-content">

<header class="admin-page-header"><div><h1>Lista de espera</h1><p>Quando alguém cancela, veja aqui quem pode aproveitar — e encaixe com um clique.</p></div><div class="admin-header-actions"><button id="espera-add" class="btn primary" type="button">Adicionar à lista</button></div></header>

<section class="admin-metrics"><article><span>Esperando</span><strong id="espera-metric-waiting">0</strong><small>pedidos ativos</small></article><article><span>Encaixados</span><strong id="espera-metric-fitted">0</strong><small>este mês</small></article><article><span>Taxa de conversão</span><strong id="espera-metric-conversion">—</strong><small id="espera-metric-conversion-detail">de pedidos já resolvidos</small></article></section>

<section class="admin-surface">
  <div class="espera-toolbar">
    <div class="espera-tabs"><button data-espera-tab="esperando" class="is-active" type="button">Esperando</button><button data-espera-tab="avisado" type="button">Avisados</button><button data-espera-tab="encaixado" type="button">Encaixados</button><button data-espera-tab="cancelado" type="button">Cancelados</button></div>
    <div class="espera-modes"><button id="espera-mode-week" type="button">Semana</button><button id="espera-mode-month" class="is-active" type="button">Mês</button></div>
    <div class="espera-rangenav"><button id="espera-prev" class="btn ghost" type="button" aria-label="Período anterior">‹</button><strong id="espera-range-label">—</strong><button id="espera-next" class="btn ghost" type="button" aria-label="Próximo período">›</button></div>
  </div>
  <details class="espera-filtros"><summary>Filtrar por dia e turno</summary><div class="espera-chips">
    <div class="espera-chip-group"><span>Dia da semana</span><button class="espera-chip is-selected" data-weekday-chip="2" type="button">Ter</button><button class="espera-chip is-selected" data-weekday-chip="3" type="button">Qua</button><button class="espera-chip is-selected" data-weekday-chip="4" type="button">Qui</button><button class="espera-chip is-selected" data-weekday-chip="5" type="button">Sex</button><button class="espera-chip is-selected" data-weekday-chip="6" type="button">Sáb</button></div>
    <div class="espera-chip-group"><span>Turno</span><button class="espera-chip is-selected" data-period-chip="manha" type="button">Manhã</button><button class="espera-chip is-selected" data-period-chip="tarde" type="button">Tarde</button></div></div></details>
  <div id="espera-list"></div>
</section>

</main></div>

<div id="espera-modal" class="admin-modal" hidden><div class="admin-modal-backdrop" data-close-espera-modal></div><section class="admin-modal-card" role="dialog" aria-modal="true" aria-labelledby="espera-modal-title"><button class="admin-modal-close" type="button" data-close-espera-modal aria-label="Fechar">×</button><h2 id="espera-modal-title">Adicionar à lista de espera</h2><input id="espera-entry-id" type="hidden">
<div class="admin-inline-fields">
<label>Nome completo<input id="espera-entry-name" type="text" autocomplete="name"></label>
<label>WhatsApp<input id="espera-entry-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999"></label>
<label>E-mail <small>opcional</small><input id="espera-entry-email" type="email" autocomplete="email"></label>
<label>Serviço desejado <small>opcional</small><input id="espera-entry-service" type="text" placeholder="Ex: Corte de cabelo"></label>
<label>Valor (R$) <small>opcional</small><input id="espera-entry-price" type="number" inputmode="decimal" min="0" step="0.5"></label>
<label>Duração (min) <small>opcional</small><input id="espera-entry-duration" type="number" inputmode="numeric" min="10" max="240"></label>
</div>

<div class="espera-datemode-row">
<label class="espera-radio-inline"><input type="radio" name="espera-entry-date-mode" value="any" checked> Qualquer dia</label>
<label class="espera-radio-inline"><input type="radio" name="espera-entry-date-mode" value="date"> Dia específico</label>
<label class="espera-radio-inline"><input type="radio" name="espera-entry-date-mode" value="weekdays"> Dias da semana</label>
</div>
<div id="espera-entry-date-field" hidden class="admin-inline-fields"><label>Data<input id="espera-entry-date" type="date"></label></div>
<div id="espera-entry-weekdays-field" hidden class="espera-weekday-picker">
<button type="button" class="espera-chip" data-entry-weekday="2">Ter</button>
<button type="button" class="espera-chip" data-entry-weekday="3">Qua</button>
<button type="button" class="espera-chip" data-entry-weekday="4">Qui</button>
<button type="button" class="espera-chip" data-entry-weekday="5">Sex</button>
<button type="button" class="espera-chip" data-entry-weekday="6">Sáb</button>
</div>
<div class="admin-inline-fields"><label>Turno<select id="espera-entry-period"><option value="qualquer">Tanto faz</option><option value="manha">Manhã</option><option value="tarde">Tarde</option></select></label></div>
<label class="admin-modal-notes">Observações <small>opcional</small><textarea id="espera-entry-notes" rows="2"></textarea></label>
<p id="espera-entry-message" class="field-help"></p>
<div class="admin-modal-actions"><button type="button" data-close-espera-modal>Cancelar</button><button id="espera-form-save" class="btn primary" type="button">Salvar</button></div>
</section></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script><script src="agenda-config-v6.js?v=29.249.0"></script><script src="admin-shell-v30.js?v=29.259.0"></script><script src="admin-ux-v30.js?v=29.259.0"></script><script src="services-catalog-v7.js?v=29.274.5"></script><script src="admin-espera-v28.js?v=29.254.0"></script><script src="admin-pwa.js?v=29.259.0"></script><script src="admin-push-runtime-v24-6.js?v=28.17.1"></script></body></html>
