<!doctype html><html lang="pt-BR"><head><title>Reativação | Barbearia OS</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0b"><link rel="icon" href="assets/icon-192.png?v=2"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css?v=29.256.0"><link rel="stylesheet" href="/css/06-admin-reforma.css?v=29.255.0"><link rel="manifest" href="admin-manifest.webmanifest?v=29.205.6"><link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png?v=2">

</head><body data-admin-page="leads"><div class="bg-grain"></div><section id="admin-login" class="admin-auth-card" data-shell="login"></section><div id="admin-app" class="admin-app" hidden><aside class="admin-sidebar" data-shell="sidebar"></aside><main class="admin-content">

<header class="admin-page-header"><div><h1>Reativação</h1><p>A JuIA já avisa sozinha quando uma vaga que alguém queria reabre. Aqui você acompanha quem ainda está no funil e pode disparar uma campanha manual pra quem esfriou.</p></div></header>

<section class="admin-metrics"><article><span>Quente</span><strong id="leads-metric-quente">0</strong><small>alta intenção</small></article><article><span>Morno</span><strong id="leads-metric-morno">0</strong><small>intenção média</small></article><article><span>Frio</span><strong id="leads-metric-frio">0</strong><small>esfriou</small></article><article><span>Taxa de recuperação</span><strong id="leads-metric-rate">0%</strong><small>viraram agendamento</small></article></section>

<section class="admin-surface">
  
  <div class="leads-reasons" id="leads-reasons"></div>

  <div class="leads-campaign">
    <label style="flex:0 0 auto;color:var(--muted);font-size:var(--t-base)">Disparar campanha manual</label>
    <input id="leads-campaign-filter" type="text" placeholder="Filtrar por serviço (opcional, ex: Barba na navalha com toalha quente)">
    <button id="leads-campaign-send" class="btn primary" type="button">Disparar</button>
    <span id="leads-campaign-result" class="field-help"></span>
  </div>

  <div class="leads-tabs">
    <button data-leads-tab="all" class="is-active" type="button">Todos</button>
    <button data-leads-tab="quente" type="button">Quente</button>
    <button data-leads-tab="morno" type="button">Morno</button>
    <button data-leads-tab="frio" type="button">Frio</button>
  </div>
  <div id="leads-list"></div>
</section>

</main></div>
