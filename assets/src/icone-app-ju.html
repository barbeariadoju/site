<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#3a3a3a;font:14px system-ui;color:#fff;padding:20px}
  .linha{display:flex;gap:40px;align-items:flex-end;margin-bottom:28px}
  .op{display:grid;gap:10px;justify-items:center}
  .op svg{width:256px;height:256px;border-radius:56px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .mini{display:flex;gap:14px;align-items:center}
  .mini svg{border-radius:13px;box-shadow:none}
  .tela{display:flex;gap:18px;padding:22px;border-radius:24px;background:linear-gradient(160deg,#2c4a6e,#1b2a3f)}
  .tela figure{margin:0;display:grid;justify-items:center;gap:6px;font-size:12px}
  .tela svg{width:60px;height:60px;border-radius:14px}
  h2{margin:0 0 12px;font-weight:600}
</style></head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <path id="bigode-metade" d="M256 250 C 268 222, 298 208, 330 215 C 364 222, 386 248, 410 250 C 428 251, 439 238, 438 218 C 456 214, 472 234, 464 260 C 455 290, 410 302, 374 291 C 341 281, 314 269, 296 273 C 280 277, 266 288, 256 304 C 245 285, 245 266, 256 250 Z"/>
    <g id="bigode"><use href="#bigode-metade"/><use href="#bigode-metade" transform="translate(512,0) scale(-1,1)"/></g>
    <pattern id="poste" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="44" height="44" fill="#f4efe4"/><rect width="14" height="44" fill="#c0242b"/><rect x="22" width="14" height="44" fill="#1f3f8f"/>
    </pattern>
    <radialGradient id="pergaminho" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#f1e7cf"/><stop offset="1" stop-color="#d8c8a2"/></radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c987"/><stop offset="1" stop-color="#c89b55"/></linearGradient>
  </defs>
</svg>

<!-- A: pergaminho creme, bigode e JU (cores do letreiro) -->
<template id="A"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="url(#pergaminho)"/>
  <rect x="34" y="34" width="444" height="444" rx="70" fill="none" stroke="#2a1a12" stroke-opacity=".22" stroke-width="6"/>
  <g transform="translate(256 150) scale(.62) translate(-256 -262)" fill="#1c120c"><use href="#bigode"/></g>
  <text x="256" y="408" text-anchor="middle" font-family="Bebas Neue" font-size="250" fill="#2a1a12" stroke="#2a1a12" stroke-width="9" stroke-linejoin="round" letter-spacing="10">JU</text>
</svg></template>

<!-- B: preto do site, placa creme com JU e faixa do poste -->
<template id="B"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0b0b0b"/>
  <rect x="86" y="96" width="340" height="320" rx="44" fill="url(#pergaminho)"/>
  <rect x="86" y="354" width="340" height="62" fill="url(#poste)" clip-path="inset(0 round 0 0 44px 44px)"/>
  <path d="M86 354 H426 V372 A44 44 0 0 1 382 416 H130 A44 44 0 0 1 86 372 Z" fill="url(#poste)"/>
  <g transform="translate(256 158) scale(.46) translate(-256 -262)" fill="#1c120c"><use href="#bigode"/></g>
  <text x="256" y="336" text-anchor="middle" font-family="Bebas Neue" font-size="190" fill="#2a1a12" stroke="#2a1a12" stroke-width="7" stroke-linejoin="round" letter-spacing="8">JU</text>
</svg></template>

<!-- C: preto e dourado, anel de poste de barbeiro e JU dourado -->
<template id="C"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0b0b0b"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#poste)" stroke-width="30"/>
  <circle cx="256" cy="256" r="157" fill="none" stroke="#c89b55" stroke-opacity=".5" stroke-width="3"/>
  <text x="256" y="300" text-anchor="middle" font-family="Bebas Neue" font-size="190" fill="url(#ouro)" stroke="url(#ouro)" stroke-width="7" stroke-linejoin="round" letter-spacing="8">JU</text>
  <g transform="translate(256 346) scale(.4) translate(-256 -262)" fill="url(#ouro)"><use href="#bigode"/></g>
</svg></template>

<div class="linha" id="grandes"></div>
<h2>Como fica na tela do celular (60px)</h2>
<div class="tela" id="tela"></div>
<script>
  document.fonts.load('250px "Bebas Neue"').then(() => {
    for (const k of ['C']) {
      const g = document.createElement('div'); g.className = 'op';
      g.innerHTML = document.getElementById(k).innerHTML + `<b>Opção ${k}</b>`; document.getElementById('grandes').append(g);
      const t = document.createElement('figure'); t.innerHTML = document.getElementById(k).innerHTML + `<figcaption>Opção ${k}</figcaption>`; document.getElementById('tela').append(t);
    }
    document.body.dataset.pronto = '1';
  });
</script>
</body></html>
