<!doctype html><html lang="pt-BR"><head><title>Avaliações Google | Barbearia OS</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0b0b"><link rel="icon" href="assets/icon-192.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css?v=29.175.0"><link rel="manifest" href="admin-manifest.webmanifest?v=28.16.1"><link rel="apple-touch-icon" href="assets/apple-touch-icon-180.png">
<style>
.avaliacoes-tabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-bottom:18px;flex-wrap:wrap}
.avaliacoes-tabs button{appearance:none;background:transparent;border:0;color:var(--muted);font:inherit;font-weight:600;font-size:.85rem;padding:.4rem .9rem;cursor:pointer}
.avaliacoes-tabs button.is-active{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1206}
.avaliacoes-card{border:1px solid var(--line);border-radius:16px;background:rgba(240,201,135,.03);margin-bottom:12px;transition:border-color .18s}
.avaliacoes-card:hover{border-color:rgba(240,201,135,.35)}
.avaliacoes-stars{color:#f1d675;letter-spacing:1px}
.avaliacoes-status{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#121212;border:1px solid rgba(255,255,255,.08);font-size:.72rem;font-weight:700;white-space:nowrap}
.avaliacoes-status[data-status="pending"]{color:#f1d675}
.avaliacoes-status[data-status="approved"]{color:#7ee2aa}
.avaliacoes-status[data-status="posted"]{color:#8fbfe0}
.avaliacoes-status[data-status="ignored"]{color:#888}
.avaliacoes-comment{margin:0 0 10px;color:var(--muted);font-size:.9rem;white-space:pre-wrap}
.avaliacoes-draft{width:100%;min-height:100px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);font:inherit;font-size:.88rem;resize:vertical}
.avaliacoes-card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.avaliacoes-card-actions button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;font-size:.82rem;font-weight:600;padding:.4rem .8rem;border-radius:10px;cursor:pointer}
.avaliacoes-card-actions .is-primary{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1206;border-color:transparent}
.avaliacoes-card-actions .is-danger{color:#e6a0a0;border-color:rgba(220,100,100,.35)}
.avaliacoes-card-actions button[disabled]{opacity:.4;cursor:not-allowed}
.avaliacoes-meta{color:var(--muted);font-size:.78rem}
.avaliacoes-no-draft{color:#e6a0a0;font-size:.82rem;font-style:italic}
@media(max-width:700px){.avaliacoes-card-actions{flex-direction:column}.avaliacoes-card-actions button{width:100%;text-align:center}}
</style>
</head><body data-admin-page="avaliacoes"><div class="bg-grain"></div><section id="admin-login" class="admin-auth-card" data-shell="login"></section><div id="admin-app" class="admin-app" hidden><aside class="admin-sidebar" data-shell="sidebar"></aside><main class="admin-content">

<header class="admin-page-header"><div><p class="eyebrow">Avaliações Google</p><h1>Responda com um clique — nunca sozinha.</h1><p>A IA prepara um rascunho pra cada avaliação nova. Revise, edite se quiser e só então aprove e publique.</p></div></header>

<section class="admin-metrics"><article><span>Pendentes</span><strong id="avaliacoes-metric-pending">0</strong><small>aguardando revisão</small></article><article><span>Publicadas</span><strong id="avaliacoes-metric-posted">0</strong><small>este mês</small></article></section>

<section class="admin-surface">
  <div class="avaliacoes-tabs">
    <button data-avaliacoes-tab="pending" class="is-active" type="button">Pendentes</button>
    <button data-avaliacoes-tab="approved" type="button">Aprovadas</button>
    <button data-avaliacoes-tab="posted" type="button">Publicadas</button>
    <button data-avaliacoes-tab="ignored" type="button">Ignoradas</button>
  </div>
  <div id="avaliacoes-list"></div>
</section>

</main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="agenda-config-v6.js?v=29.32.0"></script><script src="admin-shell-v30.js?v=29.175.0"></script><script src="admin-ux-v30.js?v=29.174.0"></script><script src="admin-avaliacoes-v28.js?v=28.33.0"></script><script src="admin-pwa.js?v=28.58.0"></script><script src="admin-push-runtime-v24-6.js?v=28.17.1"></script></body></html>
